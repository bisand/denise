[package]
name = "denise-designer"
description = "A visual form designer for DeniseUI: drag widgets onto a form and edit their properties."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
denise = { workspace = true, features = ["std"] }
denise-forms = { workspace = true }
denise-ui = { workspace = true, features = ["std"] }
denise-winit = { workspace = true }

# Preview mode puts the on-screen keyboard up over the form under design, so
# that "the form gets out of the keyboard's way by shrinking" can be checked on
# the form being designed rather than after it ships.
denise-keyboard = { workspace = true }

# A form under design names pictures, and a designer that drew none of them would
# be showing something other than what the panel will.
denise-image = { workspace = true, features = ["png", "jpeg", "gif"] }

# The platform's own Open and Save dialogs. Its Linux default is the XDG desktop
# portal rather than GTK, so this adds no system packages to a build.
rfd = "0.15"

# The system clipboard, which is a platform thing the toolkit does not touch and
# never will: a `no_std` widget library has no business knowing what a desktop
# is. Text only — the default features pull in the whole `image` crate to put
# pictures on the clipboard, and what goes on the clipboard here is `.dform`
# source.
arboard = { version = "3", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
