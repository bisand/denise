[package]
name = "denise-wgpu"
description = "A GPU painter for Denise on wgpu — the desktop implementation of the painting trait that is not the software rasteriser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# docs.rs builds one configuration and shows it to everybody, so ask for every
# feature: an item behind a feature gate should be documented and badged, not
# absent.
[package.metadata.docs.rs]
all-features = true

[dependencies]
denise = { workspace = true, features = ["std"] }
bytemuck = { workspace = true, features = ["derive"] }
pollster = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
wgpu = { workspace = true }

[dev-dependencies]
denise-render = { workspace = true, features = ["std"] }
denise-text = { workspace = true, features = ["std"] }
denise-ui = { workspace = true, features = ["std", "raster"] }
winit = { workspace = true }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
