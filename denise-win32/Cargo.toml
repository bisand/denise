[package]
name = "denise-win32"
description = "Windows child-window control for Denise, for a panel inside an existing Win32 application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../README.md"
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# `keymap` is platform-independent so it can be tested without Windows; only the
# window and the DIB section are gated. As in denise-drm and denise-evdev.
[dependencies]
denise = { workspace = true, features = ["std"] }

[target.'cfg(windows)'.dependencies]
thiserror = { workspace = true, features = ["std"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
denise-render = { workspace = true, features = ["std"] }
denise-ui = { workspace = true, features = ["std"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
