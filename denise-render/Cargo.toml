[package]
name = "denise-render"
description = "Software rasteriser for Denise: rectangles, rounded rectangles, circles, arcs, lines and alpha blending."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# docs.rs builds one configuration and shows it to everybody, so ask for every
# feature: an item behind a feature gate should be documented and badged, not
# absent.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = ["denise/std"]

[dependencies]
denise = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
