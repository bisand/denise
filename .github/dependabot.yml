# Updates arrive as pull requests, weekly and in one piece, so that falling
# behind is something somebody declines rather than something that happens.
# Fifty-three crates were out of date the day this file was written, and
# nothing had said so.
version: 2
updates:
  # One PR for every semver-compatible bump: they are lockfile-only and CI is
  # the review. A new major version changes a manifest and usually some code,
  # so each of those comes alone and gets read.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      compatible:
        update-types: [minor, patch]
    ignore:
      # `windows` and `windows-core` are one thing in two crates: `windows`
      # re-exports the `windows-core` it was built against, and a major of
      # either alone does not compile. The first such PR bumped `windows-core`
      # to 0.100 while the newest `windows` still wanted 0.62, and there is no
      # way to tell Dependabot "both or neither". They are bumped by hand,
      # together, when a `windows` release exists for the new core. Minors
      # and patches still arrive with the group.
      - dependency-name: windows
        update-types: ["version-update:semver-major"]
      - dependency-name: windows-core
        update-types: ["version-update:semver-major"]

  # The fuzz targets are their own workspace with their own lockfile.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    groups:
      compatible:
        update-types: [minor, patch]

  # Actions are pinned to commit SHAs — a tag can be moved under a workflow
  # that holds the crates.io token, a commit cannot. Dependabot reads the
  # `# vX.Y.Z` comment beside each pin and moves both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
