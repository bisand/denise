name: Website

# The marketing site and guide at https://bisand.github.io/denise/.
#
# It carries the live demo, which is the gallery and the record editor compiled
# to `wasm32-wasip1` from `site/wasm` — so a change to those examples or to the
# crates they use changes what the site shows, and the paths below say so.
on:
  push:
    branches: [main]
    paths: &site
      - 'site/**'
      - '.github/workflows/site.yml'
      - 'examples/gallery/**'
      - 'examples/table-editor/**'
      - 'denise*/**'
      - 'Cargo.toml'
  # The site is the one thing the fourteen Rust jobs deliberately do not check —
  # `site/**` is in CI's inert-paths list — so it checks itself here, on the pull
  # request, and not for the first time on main. A `'` inside a single-quoted
  # string in `widgets.ts` deployed red twice before this existed.
  pull_request:
    paths: *site
  # Deliberately **not** `release: published`. A release event runs at the tag,
  # and the `github-pages` environment only lets `main` deploy, so such a run
  # is rejected after building — a red `deploy` on the released commit, which
  # the release workflow's CI gate reads as a red tree and refuses to publish
  # over. It has stopped a publish (v0.25.0) and gone unnoticed once before
  # that, at v0.24.1. A release still rebuilds the site, which is how the
  # version it shows gets updated: `release.yml` dispatches this workflow onto
  # `main` once the crates and the downloads are up. See `docs/releasing.md`.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: site/wasm

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      # The demo first: the site's build fails if `static/wasm/denise.wasm` is
      # missing, which is the point — a page promising a live toolkit must not
      # deploy without one.
      - run: npm run wasm
        working-directory: site

      - run: npm run build
        working-directory: site
        env:
          # Served from https://bisand.github.io/denise/. Drop this if a custom
          # domain (CNAME) ever points at the site.
          BASE_PATH: /${{ github.event.repository.name }}
          # For the latest-release lookup in `vite.config.ts`: unauthenticated,
          # a runner's address shares sixty requests an hour with everything
          # else on it, and a rate-limited build would quietly show the
          # manifest's version instead of the published one.
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/build

  deploy:
    needs: build
    # A pull request builds to find out whether it would deploy; only main does.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
