name: Release

# Publishing is the one irreversible thing this repository does: a version can be
# yanked, never replaced. So the trigger is a **published GitHub release** — a
# deliberate act, with notes somebody wrote — rather than a tag push or a merge to
# main. Every guard below fails closed.
#
# The order matters and is the opposite of the usual arrangement: the release
# exists first and describes what is about to go out, then crates.io follows. A
# release that fails to publish stays visible, with a red workflow beside it,
# instead of a tag nobody can explain.
#
# To rehearse without publishing anything, run this workflow by hand from the
# Actions tab. With no release attached it stops after the dry run.
#
# See docs/releasing.md.

on:
  release:
    types: [published]
  workflow_dispatch:

# Nothing here writes to the repository: the release already exists. The check
# API is read to confirm the tagged commit passed CI.
permissions:
  contents: read
  checks: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish the workspace to crates.io
    runs-on: ubuntu-latest
    steps:
      # Explicitly the release's own tag rather than whatever ref the event
      # happens to carry. A release can point at any commit, including one that
      # is not the tip of main, and that commit is the one being published.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # `cargo publish` verifies by building, and `denise-winit` pulls in winit.
      - name: Install winit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      # Deliberately no build cache, for two reasons.
      #
      # A release should verify from cold: a cached artifact from another commit
      # makes the rehearsal less faithful than the fresh build a consumer of
      # these crates actually gets. And this is the one job that holds the
      # registry token, so it runs the fewest third-party actions it can.
      #
      # There is a practical reason too. `cargo publish` unpacks each crate into
      # `target/package/<crate>-<version>/`, and Swatinem/rust-cache's cleaning
      # step walks that expecting a target directory, failing with a wall of
      # ENOENT annotations on a run that otherwise succeeded. A release that
      # looks broken and is not is worse than a slower one.
      - uses: dtolnay/rust-toolchain@stable

      # A release whose tag disagrees with the manifest publishes one version
      # under another version's name, and the release page then describes a tree
      # that never carried that number.
      - name: The release tag and the workspace version are the same number
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${TAG#v}"
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "denise"))')
          if [ "$tag" != "$version" ]; then
            echo "::error::release $TAG says $tag, the workspace at that commit says $version."
            echo "::error::Run scripts/bump-version.py $tag, commit, retag, and re-publish the release."
            exit 1
          fi
          echo "$TAG matches workspace.package.version $version"

      # A release can be cut at any commit, including one CI never saw or one
      # whose CI went red. Since the upload cannot be taken back, this asks
      # GitHub what happened to this exact commit rather than assuming.
      - name: The released commit passed CI
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" \
                   --jq '.check_runs[] | select(.name != "publish the workspace to crates.io") | "\(.conclusion // "pending")\t\(.name)"')
          if [ -z "$runs" ]; then
            echo "::error::no check runs on $sha. Release a commit CI has seen."
            exit 1
          fi
          echo "$runs"
          if echo "$runs" | grep -qvE '^(success|skipped|neutral)\b'; then
            echo "::error::not every check on $sha succeeded — see above."
            exit 1
          fi

      # The rehearsal. Packages all twelve, then verifies each against a local
      # registry built from the others — which is why this works from one runner
      # and needs nothing on the real index.
      #
      # `--locked` is deliberate: a version bump that did not refresh Cargo.lock
      # should fail here rather than halfway through an upload.
      - name: Rehearse the publish
        run: cargo publish --workspace --locked --dry-run

      # From here nothing can be undone.
      #
      # Note what verification on Linux does and does not prove for the three
      # platform crates. `denise-macos` is `#![cfg(target_os = "macos")]` and
      # `denise-win32` and `denise-activex` are `cfg(windows)` throughout, so what
      # gets compiled here is an empty crate. That checks the packaging — the
      # manifest, the file list, the dependency versions — and not the platform
      # code, which is why the CI gate above matters: the Windows runner built and
      # tested that code on this same commit.
      - name: Publish
        if: github.event_name == 'release'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked

      - name: Say what went out
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "### $TAG is on crates.io"
            echo
            cargo metadata --format-version 1 --no-deps \
              | jq -r '.packages[] | select(.publish == null)
                       | "- [\(.name) \(.version)](https://crates.io/crates/\(.name)/\(.version))"' \
              | sort
          } >> "$GITHUB_STEP_SUMMARY"
