name: CI

on:
  push:
    branches: [main]
  pull_request:
  # For the Release workflow: its version-bump commit is pushed with the
  # workflow token, which starts no `on: push` run (GitHub's recursion guard),
  # so it dispatches this workflow explicitly and waits for the verdict.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # RUSTFLAGS does not reach rustdoc, so the `cargo doc` step below was running
  # with warnings that nobody saw: seventeen dead intra-doc links accumulated
  # under a green tick before anyone thought to look.
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install winit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features
      # Everything except the two Windows crates, whose public API is behind
      # `cfg(windows)` and so does not exist on this runner -- their own
      # intra-doc links cannot resolve here, and the Windows job below documents
      # them where they compile. Same reasoning as the `default-target` each one
      # carries for docs.rs.
      - run: cargo doc --workspace --no-deps --all-features --exclude denise-win32 --exclude denise-activex

      # The optional text tiers are off by default, so `--all-features` is the
      # only build that ever sees them together and the default build is the only
      # one that sees neither. Both have to compile, and a `#[cfg]` that only
      # works in one combination is exactly the rot this catches.
      - run: cargo clippy -p denise-text --all-targets -- -D warnings
      - run: cargo test -p denise-text

  no-std:
    name: core builds without std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p denise -p denise-render -p denise-text -p denise-ui --no-default-features

  advisories:
    name: the dependency tree is allowed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Four of the crates this workspace pulls in parse bytes nobody here
      # wrote — `png`, `zune-jpeg` and `gif` behind `denise-image`, `fontdue`
      # behind `denise-text` — and all four are on by default. An advisory
      # against any of them used to ship in the next release with nothing
      # watching, fourteen crates at a time.
      #
      # The policy is in `deny.toml`, next to the reasoning for each line.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  miri:
    name: the unsafe holds up under Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2

      # `denise` and `denise-render` are `unsafe`-free and the compiler enforces
      # that. `denise-ffi` is the other extreme — every entry point takes raw
      # pointers from a C host — and until this job existed, nothing checked it
      # but review.
      #
      # `--lib` on purpose: `tests/header.rs` walks the source tree with
      # `read_dir`, which Miri's isolation refuses, and that test is about the C
      # header agreeing with the exports rather than about memory. Disabling
      # isolation to run it would trade a real check for a pointless one.
      - run: cargo miri test -p denise-ffi --lib

  fuzz:
    name: the decoders and the ABI survive a minute of nonsense
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # The explicit form. `install-action@cargo-fuzz` resolves — it is a real
      # tag — and then installs nothing, leaving `cargo fuzz` to fail as an
      # unknown command two steps later.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # A minute each, which finds regressions rather than new classes of bug —
      # the long runs belong on a schedule or on somebody's machine. It is
      # already worth its place: `abi_session` found an overflow panic in the
      # caret blink within a minute of first existing, reachable from
      # `Ui::tick` with any large clock. The fuzz crate is outside the workspace
      # on purpose; see `exclude` in the root manifest.
      #
      # Three things about the invocation, all learned the hard way:
      #
      # `--target` is spelled out because cargo-fuzz defaults to the triple *it
      # was itself built for* — and `install-action` ships a musl build for
      # portability. Left to itself it tries to build the fuzz target with a
      # statically linked libc, which the sanitiser refuses outright:
      # "sanitizer is incompatible with statically linked libc".
      #
      # `-verbosity=0` because libFuzzer narrates every new coverage unit it
      # finds: four thousand lines per target for a sixty-second run, in a job
      # whose entire message when it passes is "nothing broke".
      # `-print_final_stats=1` keeps the handful of numbers that show the run
      # actually happened, and the full output stays in a file for the one case
      # where anybody wants it.
      - name: Fuzz the image decoders
        working-directory: fuzz
        run: |
          cargo fuzz run --target x86_64-unknown-linux-gnu decode_image -- \
            -max_total_time=60 -rss_limit_mb=4096 -verbosity=0 -print_final_stats=1 \
            > decode_image.log 2>&1 || {
              echo "::error::decode_image found an input that breaks the decoders"
              tail -60 decode_image.log
              exit 1
            }
          grep -E '^stat::' decode_image.log

      - name: Fuzz the C ABI
        working-directory: fuzz
        run: |
          cargo fuzz run --target x86_64-unknown-linux-gnu abi_session -- \
            -max_total_time=60 -rss_limit_mb=4096 -verbosity=0 -print_final_stats=1 \
            > abi_session.log 2>&1 || {
              echo "::error::abi_session found a call sequence that breaks the ABI"
              tail -60 abi_session.log
              exit 1
            }
          grep -E '^stat::' abi_session.log

      # A fuzz failure is worth nothing without the bytes that caused it, and
      # those live in `fuzz/artifacts` on the runner that is about to be thrown
      # away. `cargo fuzz run <target> <artifact>` replays one locally.
      - name: Keep what the fuzzer found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            fuzz/artifacts/**
            fuzz/*.log
          if-no-files-found: ignore

  benches:
    name: benches compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Compiled, not run. Criterion wall-clock on a shared GitHub runner varies
      # by well over the 10% a regression gate would want to trip on, so a timing
      # gate here would be noise that everyone learns to ignore. The gate belongs
      # on a self-hosted Pi — the target hardware — or on instruction counts.
      # Until then this job exists to stop the benches rotting.
      - run: cargo bench --workspace --no-run

  cross:
    name: core for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          # What the Pi panel is actually built as. It was covered only by
          # somebody remembering to run scripts/deploy-pi.sh.
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The core is a pure rlib with no C dependencies, so this needs no
      # cross-linker.
      - run: cargo build -p denise -p denise-render -p denise-text -p denise-ui --target ${{ matrix.target }} --no-default-features
      - run: cargo build -p denise -p denise-render -p denise-text -p denise-ui --target ${{ matrix.target }} --features std

      # The Linux backends, on the architectures they are actually run on. These
      # landed in M2 and this job never grew to cover them: until now they were
      # compiled for arm only on the laptop of whoever last deployed to a Pi, and
      # never for arm-gnu at all. `check` rather than `build` because they are
      # rlibs -- nothing here links, and the question is whether they compile.
      - run: cargo check -p denise-drm -p denise-evdev -p denise-fbdev -p denise-video --target ${{ matrix.target }} --all-features

  isolation:
    name: core pulls in no platform code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The central promise of the architecture: an embedded build never compiles
      # winit, Wayland, X11, Windows or macOS code. Assert it rather than hope.
      # The rasteriser is held to the same standard — it is the other half of what
      # an embedded target actually links.
      - name: Assert the dependency tree stays clean
        run: |
          status=0
          for crate in denise denise-render denise-text denise-ui; do
            tree=$(cargo tree -p "$crate" --no-default-features --edges normal --prefix none)
            echo "== $crate =="
            echo "$tree"
            if echo "$tree" | grep -Eiq '^(winit|softbuffer|wayland|x11|xkb|windows|objc|core-graphics|smithay|calloop)'; then
              echo "::error::$crate has picked up a platform dependency"
              status=1
            fi
          done
          exit $status

  versions:
    name: the workspace versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # Every crate here shares one version and they are released together, so a
      # sibling dependency must require exactly the version that sibling is.
      #
      # This exists because the failure is invisible. `[workspace.dependencies]`
      # pins each sibling by version *and* path: the path is what resolves in
      # this tree, the version is what gets uploaded. Bump
      # `workspace.package.version` and forget those pin lines, and
      # `denise-ui 0.1.0` goes to crates.io requiring `denise-render 0.0.1` — it
      # publishes, it resolves, and every consumer gets a combination that was
      # never built once. Nothing in a local build can notice, because locally
      # the path wins.
      #
      # No toolchain build and no cache: `cargo metadata --no-deps` reads the
      # manifests and resolves nothing, which takes about a tenth of a second.
      - name: Assert every sibling pin matches that sibling's version
        run: |
          python3 - <<'PY'
          import json, subprocess, sys

          meta = json.loads(subprocess.run(
              ["cargo", "metadata", "--format-version", "1", "--no-deps"],
              capture_output=True, text=True, check=True).stdout)

          # `publish = false` crates — the benches and the examples — are never
          # uploaded, so their manifests cannot mislead anyone and their
          # path-only dependencies on each other are legitimate.
          published = {
              p["name"]: p["version"] for p in meta["packages"] if p["publish"] is None
          }

          wrong = 0

          # Lockstep: one number across every published crate, so that "which versions work
          # together" has the answer "the matching ones" rather than a table
          # somebody has to maintain. A crate that sets its own version breaks
          # that promise quietly, and every pin below would still agree.
          numbers = sorted(set(published.values()))
          if len(numbers) > 1:
              for name, version in sorted(published.items()):
                  print(f"    {name} {version}")
              print(
                  f"::error::the published crates are at {len(numbers)} different "
                  f"versions ({', '.join(numbers)}). They release together, so "
                  "they share one number — every crate takes "
                  "version.workspace = true."
              )
              wrong += 1

          for package in sorted(meta["packages"], key=lambda p: p["name"]):
              if package["name"] not in published:
                  continue
              for dep in package["dependencies"]:
                  if dep["name"] not in published:
                      continue
                  # `version = "0.4.1"` becomes the requirement `^0.4.1`. The
                  # comparison is deliberately exact rather than a semver match:
                  # `^0.4` would satisfy 0.4.1 and still be wrong here, because
                  # lockstep means the number is a statement about which build
                  # was tested together, not a range.
                  want = "^" + published[dep["name"]]
                  if dep["req"] != want:
                      kind = dep.get("kind") or "normal"
                      print(
                          f"::error::{package['name']} requires "
                          f"{dep['name']} {dep['req']} ({kind}), but "
                          f"{dep['name']} is {published[dep['name']]} — "
                          f"the pin should be {want}"
                      )
                      wrong += 1

          if wrong:
              print(
                  f"::error::{wrong} problem(s). The pins live in "
                  "[workspace.dependencies] in the root Cargo.toml, and every "
                  "one of them has to move when workspace.package.version does."
              )
              sys.exit(1)

          print(f"{len(published)} published crates, all at {numbers[0]}, every pin agrees")
          PY

  c-abi:
    name: the C ABI links and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The header is written by hand, so nothing but a real C compiler proves it
      # is valid C. `tests/header.rs` checks that it *agrees* with the Rust; this
      # checks that it parses, links, and that the library behind it works when
      # driven from the other side of the ABI.
      - run: cargo build -p denise-ffi --release
      - run: make -C denise-ffi/examples run

      # C++ hosts are half of what an ActiveX shim serves, and `extern "C"` in
      # the header is only load-bearing if somebody compiles it as C++.
      - name: The header is valid C++ too
        run: |
          echo '#include "denise.h"' > /tmp/cxx.cpp
          echo 'int main() { return denise_abi_version() == DENISE_ABI_VERSION ? 0 : 1; }' >> /tmp/cxx.cpp
          c++ -std=c++17 -Wall -Wextra -Idenise-ffi/include -o /tmp/cxx /tmp/cxx.cpp \
              -Ltarget/release -ldenise_ffi -Wl,-rpath,"$PWD/target/release"
          /tmp/cxx

  windows:
    name: the Win32 control builds and its tests run
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # This is the only machine in CI that can compile `denise-win32` at all —
      # everywhere else it is `#![cfg(windows)]` and disappears. Its unit tests
      # need real GDI, which is the point of running them here rather than
      # mocking a DIB section.
      - run: cargo clippy -p denise-win32 --all-targets -- -D warnings
      - run: cargo test -p denise-win32

      # Where these two can actually be documented: RUSTDOCFLAGS is -D warnings
      # for every job, so a dead link here fails the build like anywhere else.
      - run: cargo doc -p denise-win32 -p denise-activex --no-deps --all-features

      # The COM server is the only crate here that produces a DLL Windows loads
      # by class id, and it compiles nowhere else. `tests/automation.rs` is the
      # reason this matters beyond "it builds": every value a script assigns
      # arrives as a VARIANT, built and read by hand through three nested unions,
      # and that code needs oleaut32 to coerce and a real Invoke at either end
      # before it means anything.
      - run: cargo clippy -p denise-activex --all-targets -- -D warnings
      - run: cargo test -p denise-activex
      - run: cargo build -p denise-activex --release

      # The cdylib and its header are meant to be linked from Windows hosts, and
      # the export list differs from the ELF one enough to be worth proving.
      - run: cargo build -p denise-ffi --release
      - run: cargo test -p denise-ffi

  macos:
    name: the Cocoa view builds and its tests run
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # The counterpart to the Windows job, and the same argument. `denise-macos`
      # is `#![cfg(target_os = "macos")]` from its first line, so on every other
      # runner it compiles to nothing at all — until this job existed the crate
      # went to crates.io having been built by nobody but its author. Its surface
      # tests want a real CGBitmapContext and a real IOSurface, which is the
      # point of running them on a Mac rather than asserting about strides.
      - run: cargo clippy -p denise-macos --all-targets -- -D warnings
      - run: cargo test -p denise-macos

      # Where this one can actually be documented, for the reason the manifest's
      # `default-target` gives: linux documents an empty crate.
      - run: cargo doc -p denise-macos --no-deps --all-features
