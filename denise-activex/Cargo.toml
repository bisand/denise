[package]
name = "denise-activex"
description = "COM/ActiveX shim for Denise, so legacy Windows hosts can embed the control."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# `cdylib` because a COM server is a DLL the host loads by CLSID; `rlib` so the
# registration table can be unit tested without one.
# docs.rs builds on linux, where the target-gated half of this crate does not
# compile and so is not documented. Point it at Windows, where all of it is.
[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-pc-windows-msvc"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[target.'cfg(windows)'.dependencies]
denise = { workspace = true, features = ["std"] }
denise-ui = { workspace = true, features = ["std", "raster"] }
denise-win32 = { workspace = true }
# `windows-core` is named directly because that is what `#[implement]` expands
# to: the macro emits `windows_core::` paths and needs the crate in scope. It is
# a component of the `windows` crate and already in the tree underneath it, not a
# separate third party.
windows-core = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    # RegCreateKeyExW takes a SECURITY_ATTRIBUTES, so the registry calls are gated
    # on the crate that defines it.
    "Win32_Security",
    "Win32_Graphics_Gdi",
    # IObjectSafety, which the metadata files under Diagnostics_Debug rather than
    # Ole. The interface is the scripting safety claim; see the `safety` module.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    # VARIANT and VariantChangeType: every value a script assigns arrives as one,
    # tagged with whatever type the host felt like sending.
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

# `IAdviseSink` is already in the tree — `IOleObject::Advise` takes one — but
# *implementing* it needs `STGMEDIUM`, which lives behind this feature. The view
# tests implement one to check that a container is told when the design-time
# picture goes stale. Same crate, one more feature, no new dependency.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_Com_StructuredStorage"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
