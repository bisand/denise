[package]
name = "denise-ui"
description = "Scene graph, widgets and compositor for Denise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# docs.rs builds one configuration and shows it to everybody, so ask for every
# feature: an item behind a feature gate should be documented and badged, not
# absent.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = ["denise/std", "denise-render/std", "denise-text/std"]
# Passed through so an application picks its text tier once, on `denise-ui`.
truetype = ["denise-text/truetype"]
shaping = ["denise-text/shaping"]

[dependencies]
denise = { workspace = true }
denise-render = { workspace = true }
denise-text = { workspace = true }
slotmap = { workspace = true }

[dev-dependencies]
denise-render = { workspace = true, features = ["std"] }
denise-text = { workspace = true, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
