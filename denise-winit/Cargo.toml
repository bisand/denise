[package]
name = "denise-winit"
description = "Desktop development and preview backend for Denise, on winit + softbuffer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# docs.rs builds one configuration and shows it to everybody, so ask for every
# feature: an item behind a feature gate should be documented and badged, not
# absent.
[package.metadata.docs.rs]
all-features = true

# `gpu` presents through `denise-wgpu` instead of a CPU buffer. Off by default:
# it is for the designer on a large display, and a preview window does not need
# a GPU to be a preview window. With it off, `Present::Gpu` is an error at
# window creation rather than a compile error, so an application can offer the
# choice without a cfg.
[features]
gpu = ["dep:denise-wgpu", "dep:wgpu", "dep:pollster"]

[dependencies]
denise = { workspace = true, features = ["std"] }
# For the provided `DeniseApp::render`, which rasterises through `paint`.
denise-render = { workspace = true, features = ["std"] }
denise-wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
thiserror = { workspace = true, features = ["std"] }
wgpu = { workspace = true, optional = true }
winit = { workspace = true }

# On macOS the whole present path is different, and it has to be: softbuffer's
# CoreGraphics backend allocates a fresh buffer per frame, reports a buffer age
# of 0 so the shadow is copied in full, and discards the damage rectangles it is
# handed. `denise-macos` already owns the answer — pixels in an `IOSurface` the
# compositor reads where they lie — so this borrows it rather than growing a
# second copy. Measured on a 1040x720 surface with one spinner: 9.2% of a core
# to 2.0%.
# softbuffer presents everywhere except macOS, where its CoreGraphics backend is
# the problem rather than the solution — see `macos.rs`. Not compiled there at
# all, so the bad path cannot be reached by accident.
[target.'cfg(not(target_os = "macos"))'.dependencies]
softbuffer = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
denise-macos = { workspace = true }
objc2 = { workspace = true }
# `NSWindow` is for `owner.rs` — the child-window call that makes a secondary
# window sit above the one that opened it — and nothing else here needs it.
objc2-app-kit = { workspace = true, features = [
    "objc2-quartz-core",
    # `NSGraphics` is where `NSWindowOrderingMode` lives, and the child-window
    # call is gated on it.
    "NSGraphics",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-io-surface = { workspace = true, features = ["IOSurfaceRef"] }
objc2-quartz-core = { workspace = true, features = [
    "CALayer",
    "CATransaction",
    "objc2-core-foundation",
] }

[dev-dependencies]
# For the README's `paint` example, which draws a `Ui`.
denise-ui = { workspace = true, features = ["std"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
