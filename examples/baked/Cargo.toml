[package]
name = "baked"
description = "a panel binary with no font parser in it: the face was rasterised at build time, and the program draws from tables."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
denise = { workspace = true, features = ["std"] }
denise-render = { workspace = true, features = ["std"] }
# No `truetype`: this binary cannot read a font file, which is the point.
denise-text = { workspace = true }

[build-dependencies]
# Only the build script reads a font. `bake` brings the `truetype` tier with
# it, and neither reaches the binary above.
denise-text = { workspace = true, features = ["bake"] }
system-font = { path = "../system-font" }

[lints.rust]
unsafe_code = "forbid"
