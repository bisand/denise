[package]
name = "designed"
description = "The `hello` example again, this time built from a .dform file rather than from Rust."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# The same split every other example has: which display this talks to is decided
# at compile time, and nothing about the *form* changes between them.
[features]
default = ["desktop"]
desktop = ["dep:denise-winit"]
kiosk = ["dep:bare-linux", "dep:rustix"]

[dependencies]
denise = { workspace = true, features = ["std"] }
denise-ui = { workspace = true, features = ["raster"] }
denise-forms = { workspace = true }
denise-winit = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
bare-linux = { path = "../bare-linux", optional = true }
rustix = { workspace = true, features = ["event", "std"], optional = true }
