[package]
name = "bare-linux"
description = "Example support: opening a display, input and the console with no desktop."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
denise = { workspace = true, features = ["std"] }
denise-ui = { workspace = true, features = ["std", "raster"] }

# Linux-only, so the workspace still builds on a development machine. On anything
# else this crate compiles to nothing at all.
[target.'cfg(target_os = "linux")'.dependencies]
denise-drm = { workspace = true }
denise-evdev = { workspace = true }
denise-fbdev = { workspace = true }
rustix = { workspace = true, features = ["event", "std"] }
