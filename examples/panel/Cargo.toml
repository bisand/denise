[package]
name = "panel"
description = "M3 demo: a widget tree, a modal dialog and a cursor sprite, with no desktop."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
denise = { workspace = true, features = ["std"] }
denise-ui = { workspace = true, features = ["std"] }

# Linux-only, so the workspace still builds on a development machine.
[target.'cfg(target_os = "linux")'.dependencies]
denise-drm = { workspace = true }
denise-evdev = { workspace = true }
denise-fbdev = { workspace = true }
rustix = { workspace = true, features = ["event", "std"] }
