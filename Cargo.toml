[workspace]
resolver = "3"
members = [
    "benches",
    "denise",
    "denise-activex",
    "denise-arrange",
    "denise-drm",
    "denise-evdev",
    "denise-fbdev",
    "denise-forms",
    "denise-ffi",
    "denise-image",
    "denise-keyboard",
    "denise-layout",
    "denise-macos",
    "denise-render",
    "denise-text",
    "denise-ui",
    "denise-video",
    "denise-win32",
    "denise-winit",
    "examples/arranged",
    "examples/bare-linux",
    "examples/browser",
    "examples/designed",
    "examples/forms",
    "examples/gallery",
    "examples/hello",
    "examples/hello-rect",
    "examples/kiosk",
    "examples/launcher",
    "examples/panel",
    "examples/splash",
    "examples/system-font",
    "examples/table-editor",
    "tools/designer",
]

# The fuzz targets are a crate, but not one of these. They need nightly and a
# sanitiser, they are never published, and `versions` asserts that every member
# shares one version number and pins its siblings exactly — none of which is
# true or wanted here. `cargo fuzz` builds them from their own manifest.
exclude = ["fuzz"]

[workspace.package]
version = "0.19.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["André Biseth <andre@biseth.net>"]
repository = "https://github.com/bisand/denise"
homepage = "https://github.com/bisand/denise"

[workspace.dependencies]
denise = { version = "0.19.0", path = "denise", default-features = false }
denise-activex = { version = "0.19.0", path = "denise-activex" }
denise-arrange = { version = "0.19.0", path = "denise-arrange", default-features = false }
denise-drm = { version = "0.19.0", path = "denise-drm" }
denise-evdev = { version = "0.19.0", path = "denise-evdev" }
denise-fbdev = { version = "0.19.0", path = "denise-fbdev" }
denise-forms = { version = "0.19.0", path = "denise-forms" }
denise-ffi = { version = "0.19.0", path = "denise-ffi" }
denise-image = { version = "0.19.0", path = "denise-image", default-features = false }
denise-keyboard = { version = "0.19.0", path = "denise-keyboard" }
denise-layout = { version = "0.19.0", path = "denise-layout" }
denise-macos = { version = "0.19.0", path = "denise-macos" }
denise-render = { version = "0.19.0", path = "denise-render", default-features = false }
denise-text = { version = "0.19.0", path = "denise-text", default-features = false }
denise-ui = { version = "0.19.0", path = "denise-ui", default-features = false }
denise-video = { version = "0.19.0", path = "denise-video" }
denise-win32 = { version = "0.19.0", path = "denise-win32" }
denise-winit = { version = "0.19.0", path = "denise-winit" }

# The form file is KDL: a node tree with properties, which is what a form is,
# and a parser that hands back a document rather than a value — see docs/forms.md.
kdl = { version = "6.7", default-features = false, features = ["span"] }

drm = "0.15"
evdev = "0.13"
memmap2 = "0.9"
bytemuck = "1.25"
drm-fourcc = "2.2"
rustix = { version = "1.1", default-features = false }
slotmap = { version = "1.1", default-features = false }
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }

png = { version = "0.18", default-features = false }
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
gif = { version = "0.14", default-features = false, features = ["std"] }

criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
thiserror = { version = "2.0", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std"] }
windows = "0.62"
windows-core = "0.62"
winit = "0.30"
softbuffer = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Benches need real optimisation but also debug symbols for profiling.
[profile.bench]
debug = true
