[workspace]
resolver = "3"
members = [
    "benches",
    "denise",
    "denise-activex",
    "denise-drm",
    "denise-evdev",
    "denise-fbdev",
    "denise-ffi",
    "denise-macos",
    "denise-render",
    "denise-text",
    "denise-ui",
    "denise-win32",
    "denise-winit",
    "examples/hello-rect",
    "examples/kiosk",
    "examples/panel",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["André Biseth <andre@biseth.net>"]
repository = "https://github.com/bisand/denise"
homepage = "https://github.com/bisand/denise"

[workspace.dependencies]
denise = { version = "0.0.1", path = "denise", default-features = false }
denise-activex = { version = "0.0.1", path = "denise-activex" }
denise-drm = { version = "0.0.1", path = "denise-drm" }
denise-evdev = { version = "0.0.1", path = "denise-evdev" }
denise-fbdev = { version = "0.0.1", path = "denise-fbdev" }
denise-ffi = { version = "0.0.1", path = "denise-ffi" }
denise-macos = { version = "0.0.1", path = "denise-macos" }
denise-render = { version = "0.0.1", path = "denise-render", default-features = false }
denise-text = { version = "0.0.1", path = "denise-text", default-features = false }
denise-ui = { version = "0.0.1", path = "denise-ui", default-features = false }
denise-win32 = { version = "0.0.1", path = "denise-win32" }
denise-winit = { version = "0.0.1", path = "denise-winit" }

drm = "0.15"
evdev = "0.13"
memmap2 = "0.9"
bytemuck = "1.25"
drm-fourcc = "2.2"
rustix = { version = "1.1", default-features = false }
slotmap = { version = "1.1", default-features = false }
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }

criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
thiserror = { version = "2.0", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
windows = "0.62"
windows-core = "0.62"
winit = "0.30"
softbuffer = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Benches need real optimisation but also debug symbols for profiling.
[profile.bench]
debug = true
