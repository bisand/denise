[workspace]
resolver = "3"
members = ["denise", "denise-winit"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["BogenTech <andre@biseth.net>"]
repository = "https://github.com/bisand/denise"
homepage = "https://github.com/bisand/denise"

[workspace.dependencies]
denise = { version = "0.0.0", path = "denise", default-features = false }
denise-winit = { version = "0.0.0", path = "denise-winit" }

thiserror = { version = "2.0", default-features = false }
winit = "0.30"
softbuffer = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Benches need real optimisation but also debug symbols for profiling.
[profile.bench]
debug = true
