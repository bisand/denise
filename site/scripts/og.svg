<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89B4FA" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#F5C2E7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#94E2D5" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#89B4FA"/>
      <stop offset="0.6" stop-color="#F5C2E7"/>
      <stop offset="1" stop-color="#94E2D5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#181825"/>
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- The logo's three bitplanes, small, top left. -->
  <g transform="translate(72 66) scale(0.30)">
    <rect x="0" y="0" width="256" height="256" rx="56" fill="#1E1E2E"/>
    <rect x="40" y="46" width="128" height="88" rx="18" fill="#94E2D5" opacity="0.82"/>
    <rect x="64" y="80" width="128" height="88" rx="18" fill="#F5C2E7" opacity="0.82"/>
    <rect x="88" y="114" width="128" height="88" rx="18" fill="#89B4FA" opacity="0.86"/>
    <g transform="translate(150 128) scale(1.5)">
      <path d="M0 0 L0 34 L8.6 25.8 L14.2 38.4 L21.4 35.2 L15.8 22.8 L27 21.6 Z" fill="#11111B" stroke="#11111B" stroke-width="6" stroke-linejoin="round"/>
      <path d="M0 0 L0 34 L8.6 25.8 L14.2 38.4 L21.4 35.2 L15.8 22.8 L27 21.6 Z" fill="#FFFFFF"/>
    </g>
  </g>
  <text x="164" y="118" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#CDD6F4">DeniseUI</text>

  <text x="72" y="250" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#CDD6F4">Pixels straight</text>
  <text x="72" y="330" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="url(#ink)">to the panel.</text>

  <text x="72" y="396" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#A6ADC8">A direct-rendering UI toolkit in Rust for</text>
  <text x="72" y="434" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#A6ADC8">embedded Linux. No X11. No Wayland.</text>
  <text x="72" y="472" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#A6ADC8">No browser engine. One static binary.</text>

  <text x="72" y="556" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#6C7086">bisand.github.io/denise</text>
</svg>
