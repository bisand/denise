# What the dependency tree is allowed to contain.
#
# Fourteen crates go to crates.io together, and four of the things they pull in
# parse **untrusted bytes** on a panel that may run unattended for a year: `png`,
# `zune-jpeg` and `gif` behind `denise-image`, and `fontdue` behind
# `denise-text`. An advisory against any of those ships in the next release
# unless something is watching, and nothing was.
#
# Run it the way CI does:
#
#     cargo deny check

[graph]
# Every target this project claims in its README badge. A dependency that only
# appears on one of them is still a dependency somebody ships.
targets = [
    "aarch64-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
version = 2
# Unmaintained *transitive* dependencies are worth knowing about but are not
# somebody else's emergency: warn, and let a human decide. A vulnerability is a
# different matter and fails by default.
unmaintained = "workspace"

[bans]
# Duplicate versions of one crate cost binary size, which is a stated feature
# here — but they arrive through other people's manifests and are rarely
# actionable on the day. Worth seeing in the log, not worth failing on.
multiple-versions = "warn"
# A wildcard version requirement in a *published* crate is a real problem: it
# says any version will do, and one of them will not.
wildcards = "deny"
# The examples depend on each other by path with no version at all, which reads
# as a wildcard and is fine: they are `publish = false`, so no manifest of
# theirs ever reaches anybody. The `versions` job in CI makes the same exception
# for the same reason.
allow-wildcard-paths = true

[licenses]
version = 2
# Everything in the tree today resolves to one of these. The list is deliberately
# short and permissive-only: this project is MIT, and a copyleft dependency
# arriving unnoticed is exactly the surprise worth failing on.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # `clipboard-win` and its `error-code`, which are how `arboard` reaches the
    # Windows clipboard for the designer. Boost is permissive — no attribution
    # required in a binary, no source obligations — so it belongs in this list
    # rather than in the exceptions below: those are for licences that *fail*
    # the permissive-only rule and were let through anyway, and this one passes
    # it.
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The browser example fired the copyleft alarm this section exists for, and a
# human decided: per-crate exceptions, not a wider allow list, so the *next*
# MPL arrival still gets stopped and read. Nothing here reaches crates.io —
# the example is `publish = false` — and nothing here is modified, which is
# the case MPL-2.0's file-level terms leave indistinguishable from MIT in
# practice. CDLA-Permissive-2.0 is Mozilla's licence for the CA certificate
# *data* in webpki-roots: permissive, and data, not code.
exceptions = [
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[sources]
# crates.io and nothing else. A git dependency in a published crate cannot be
# published at all, so this catches the mistake before the release does.
unknown-registry = "deny"
unknown-git = "deny"
