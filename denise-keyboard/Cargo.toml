[package]
name = "denise-keyboard"
description = "An on-screen keyboard for Denise panels: a shelf of keys that emits what a real keyboard emits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# docs.rs builds one configuration and shows it to everybody, so ask for every
# feature: an item behind a feature gate should be documented and badged, not
# absent.
[package.metadata.docs.rs]
all-features = true

[dependencies]
denise = { workspace = true, features = ["std"] }
denise-layout = { workspace = true }
denise-ui = { workspace = true, features = ["std"] }

[dev-dependencies]
# Painting, for the test that asserts the keys land where the shelf is: a
# geometry bug draws nothing and every text assertion still passes.
denise-render = { workspace = true, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
