[package]
name = "denise-text"
description = "Glyph sources, a bounded glyph atlas, line layout and word wrapping for Denise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# docs.rs builds one configuration and shows it to everybody, so ask for every
# feature: an item behind a feature gate should be documented and badged, not
# absent.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = ["denise/std", "denise-render/std", "skrifa?/std"]
# Real TrueType and OpenType fonts, anti-aliased and proportionally spaced, and
# no shaping — see the crate docs. Read by skrifa, which is what Chrome reads
# fonts with and forbids `unsafe`, and filled by `fill.rs`, which is ours.
# `libm` is the maths skrifa uses without `std`, and is left unused with it.
#
# Variable faces need nothing asked for: they are read at their default
# instance, whatever they carry and with or without `std`. macOS's own UI face
# is one, which is why `a_variable_face_has_ink_in_it` is there.
truetype = ["dep:skrifa", "skrifa/libm"]
# Hints a glyph to the pixel grid before it is drawn, with the face's own
# bytecode and skrifa's autohinter behind it, at FreeType's Light target: only
# the horizontal edges move, so a baseline and an x-height land on a pixel
# boundary instead of across two and nothing shifts sideways. Text at the sizes
# a desktop reads at is visibly crisper for it, and a glyph costs about nine
# times as long to rasterise — once, into the atlas, and nothing per frame.
# About 310 KB of static binary, which is why a panel asks for it: skrifa's
# hinting is compiled either way and the linker drops it until something calls
# it. Nothing moves horizontally, so advances, metrics and layout are the same
# either way, and a face that carries no hints is drawn as it always was.
hinting = ["truetype"]
# Shaping, bidirectional text and font fallback, via cosmic-text. About 3.1 MB
# of static binary — four times the rest of the toolkit — so this is for panels
# that genuinely need a script the other tiers cannot draw.
shaping = ["dep:cosmic-text", "std"]
# Rasterises a face in advance, for a build script or a tool — never a panel,
# which links only the tables it writes. See `bake.rs`.
bake = ["std", "truetype"]

[dependencies]
denise = { workspace = true }
denise-render = { workspace = true }
skrifa = { workspace = true, optional = true }
cosmic-text = { workspace = true, optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
