[package]
name = "denise-text"
description = "Glyph sources, a bounded glyph atlas and line layout for Denise."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["std"]
std = ["denise/std", "denise-render/std"]

[dependencies]
denise = { workspace = true }
denise-render = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
