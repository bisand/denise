[package]
name = "denise-text"
description = "Glyph sources, a bounded glyph atlas and line layout for Denise."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["std"]
std = ["denise/std", "denise-render/std"]
# Real TrueType and OpenType fonts, anti-aliased and proportionally spaced.
# About 145 KB of static binary, and no shaping — see the crate docs.
truetype = ["dep:fontdue"]

[dependencies]
denise = { workspace = true }
denise-render = { workspace = true }
fontdue = { workspace = true, optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
