[package]
name = "denise-text"
description = "Glyph sources, a bounded glyph atlas, line layout and word wrapping for Denise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# docs.rs builds one configuration and shows it to everybody, so ask for every
# feature: an item behind a feature gate should be documented and badged, not
# absent.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
# `gvar-alloc` reads a glyph's variation tuples onto the heap. It is here
# rather than under `truetype` because it turns on ttf-parser's `std`, and a
# board with no allocator is the whole reason this crate builds without one:
# see the note on `truetype`.
std = ["denise/std", "denise-render/std", "ab_glyph?/std", "ab_glyph?/gvar-alloc"]
# Real TrueType and OpenType fonts, anti-aliased and proportionally spaced.
# About 65 KB of static binary, and no shaping — see the crate docs.
# `libm` is the maths ab_glyph uses without `std`, and is left unused with it.
# `variable-fonts` reads the outlines of a variable face. Without it such a
# face parses, answers for every character it has, and rasterises all of them
# to nothing, so a panel drawn in one lays out lines of the right height with
# no ink in any of them — and macOS's own UI face is a variable face, which
# made a blank window the default there. See `a_variable_face_has_ink_in_it`.
#
# A face whose glyphs carry more than 32 variation tuples takes a heap as
# well, which `std` adds. Without `std` a face that complex still comes out
# blank: that is the price of a target with no allocator, and a board that
# embeds its own face is unlikely to embed San Francisco.
truetype = ["dep:ab_glyph", "ab_glyph/libm", "ab_glyph/variable-fonts"]
# Shaping, bidirectional text and font fallback, via cosmic-text. About 3.1 MB
# of static binary — four times the rest of the toolkit — so this is for panels
# that genuinely need a script the other tiers cannot draw.
shaping = ["dep:cosmic-text", "std"]

[dependencies]
denise = { workspace = true }
denise-render = { workspace = true }
ab_glyph = { workspace = true, optional = true }
cosmic-text = { workspace = true, optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
